<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studium">
<meta name="description" content="Kurse, Aufgaben, Abgaben, Prüfungen und Schichten an einem Ort.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script>window.STUDIENOS_CONFIG = window.STUDIENOS_CONFIG || {supabaseUrl:"", supabaseKey:""};</script>
<title>Tims Studien-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: „Förde bei Nacht“, bewusst nur dunkel. Oben die Kieler Förde als leuchtende Linienzeichnung (Tageszeit echt),
   darunter ein Dashboard in drei Spalten: links der Tag, Mitte das Studium, rechts Fokus und Fristen.
   Weiß für Aktionen, Cyan→Violett nur für Fortschritt und Fokus, Fächerfarben als Kennung. */
:root{
  color-scheme:dark;
  --paper:#07080b; --card:#0e1015; --card-2:#151820; --card-3:#1c2029; --field:#0b0d12;
  --line:#1f232c; --line-2:#2c313d;
  --ink:#eef0f4; --ink-2:#a4aab7; --ink-3:#6d7585;
  --blue:#eef0f4; --on-blue:#0a0b0e; --blue-soft:#1a2131;
  --brass:#7cc8ff; --brass-fill:#5aaefc; --brass-soft:#0f1d30;
  --grad:linear-gradient(120deg,#6fd6ff 0%,#7f8cff 55%,#b07cff 100%);
  --red:#ff6b6b; --red-soft:#2a1316; --amber:#ffc24d; --amber-soft:#2a210d;
  --green:#4ade80; --green-soft:#0e2417;
  --s-angl:#ff8fb8; --s-inf:#5ee6dc; --s-prof:#cde46d; --s-other:#a9b1c3;
  --scrim:rgba(3,4,6,.66); --shadow:0 30px 80px -30px rgba(0,0,0,.9);
  --lift:inset 0 1px 0 rgba(255,255,255,.035),0 14px 34px -24px rgba(0,0,0,.95);
  --f-display:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono","JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-hand:var(--f-mono);
  --r:16px; --r-sm:10px;
  --on-cover:#ffffff; --cover-line:rgba(255,255,255,.09);
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:radial-gradient(900px 460px at 10% -60px,rgba(90,150,255,.09),transparent 70%),radial-gradient(760px 420px at 95% -40px,rgba(160,110,255,.07),transparent 70%),var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
::selection{background:rgba(124,200,255,.3)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}

/* Förde als Linienzeichnung */
.hero{position:relative;height:clamp(150px,17vw,230px);overflow:hidden;background:#07080b}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(to bottom,rgba(7,8,11,0),var(--paper))}
.beacon{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#e9f7ff;box-shadow:0 0 8px 3px rgba(124,200,255,.85),0 0 30px 10px rgba(124,200,255,.25);animation:beacon 5s infinite}
@keyframes beacon{0%,12%{opacity:1}20%,100%{opacity:.15}}

/* Kopf */
.pageicon{position:relative;z-index:1;width:68px;height:68px;margin-top:-44px;border-radius:18px;background:rgba(14,16,21,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line-2);box-shadow:var(--lift);display:grid;place-items:center;color:var(--brass)}
.pageicon svg{width:36px;height:36px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:14px 18px}
.brand{min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,1.3rem + 2.2vw,2.75rem);line-height:1.02;letter-spacing:-.045em;margin:0;text-wrap:balance}
.brand p{margin:.45rem 0 0;color:var(--ink-2);max-width:62ch}
.now{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.semchip{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);color:var(--ink-2)}
.semchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.15)}
.semchip.exam::before{background:var(--red);box-shadow:0 0 0 3px rgba(255,107,107,.15)}
.semchip.free::before{background:var(--ink-3);box-shadow:none}
@media (max-width:640px){.pageicon{width:58px;height:58px;margin-top:-36px;border-radius:16px}.pageicon svg{width:30px;height:30px}}

/* Tabs */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;display:flex;gap:2px;overflow-x:auto;padding:4px;margin:0 0 22px;width:max-content;max-width:100%;background:rgba(14,16,21,.8);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border:1px solid var(--line);border-radius:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;font-weight:500;color:var(--ink-3);padding:7px 13px;border-radius:10px;white-space:nowrap;cursor:pointer;transition:color .15s ease,background .15s ease}
.tab svg{width:16px;height:16px;flex:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--card-3);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.tab[aria-selected="true"] svg{color:var(--brass)}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);color:var(--ink);border:1px solid rgba(255,194,77,.18);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:.9rem}
.banner b{color:var(--amber);font-weight:600}

/* Dashboard: 3 Spalten ab 1200px, 2 ab 900px, darunter eine Spalte in eigener Reihenfolge */
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:899px){.dash{display:flex;flex-direction:column;align-items:stretch}.col{display:contents}.dash .card{order:var(--o,50)}}
@media (min-width:900px){.dash{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto 1fr}.col-m{grid-column:1;grid-row:1/span 2}.col-l{grid-column:2;grid-row:1}.col-r{grid-column:2;grid-row:2}}
@media (min-width:1200px){.dash{grid-template-columns:272px minmax(0,1fr) 300px;grid-template-rows:auto}.col-l{grid-column:1;grid-row:1}.col-m{grid-column:2;grid-row:1}.col-r{grid-column:3;grid-row:1}}

/* Raster für die übrigen Bereiche */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.grid>*{grid-column:span 12;min-width:0}
@media (min-width:760px){.md-6{grid-column:span 6}.md-4{grid-column:span 4}.md-8{grid-column:span 8}}
@media (min-width:1060px){.lg-3{grid-column:span 3}.lg-4{grid-column:span 4}.lg-5{grid-column:span 5}.lg-6{grid-column:span 6}.lg-7{grid-column:span 7}.lg-8{grid-column:span 8}.lg-row2{grid-row:span 2}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--lift);container-type:inline-size}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-display);font-size:.98rem;font-weight:600;line-height:1.25;margin:0;letter-spacing:-.015em;text-wrap:balance}
.card-h .sub{color:var(--ink-3);font-size:.82rem;font-weight:400;letter-spacing:0}
.card-h .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hicon{width:28px;height:28px;border-radius:8px;background:var(--card-2);border:1px solid var(--line-2);color:var(--brass);display:inline-grid;place-items:center;flex:none}
.hicon svg{width:15px;height:15px}
.muted{color:var(--ink-3)}
.small{font-size:.84rem}
.empty{color:var(--ink-2);font-size:.9rem;padding:12px 14px;border:1px dashed var(--line-2);border-radius:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* Knöpfe */
.btn{appearance:none;font-weight:500;font-size:.86rem;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);padding:7px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;line-height:1.2;white-space:nowrap;transition:background .15s ease,border-color .15s ease}
.btn:hover{background:var(--card-3);border-color:#3a4050}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:600}
.btn.primary:hover{background:#ffffff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brass);padding-inline:10px}
.btn.ghost:hover{background:var(--brass-soft)}
.btn.danger{color:var(--red);border-color:rgba(255,107,107,.3);background:transparent}
.btn.danger[data-armed]{background:var(--red);color:#1a0b0c;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:.8rem;border-radius:8px}
.btn svg,.iconbtn svg{width:16px;height:16px;flex:none}
.iconbtn{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink-3);width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{color:var(--ink);background:var(--card-2);border-color:var(--line-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--field)}
.seg button{appearance:none;border:0;background:transparent;font-size:.79rem;font-weight:500;color:var(--ink-3);padding:4px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card-3);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* Chips und Status */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:500;padding:2px 9px 2px 8px;border-radius:999px;background:var(--card-2);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc,var(--ink-3));flex:none}
.s-angl{--sc:var(--s-angl)}.s-inf{--sc:var(--s-inf)}.s-prof{--sc:var(--s-prof)}.s-other{--sc:var(--s-other)}
.code{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
.pill{appearance:none;border:0;font-size:.73rem;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;cursor:default}
button.pill{cursor:pointer}
.st-offen{background:var(--card-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.st-arbeit{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(255,194,77,.2)}
.st-done{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 1px rgba(74,222,128,.2)}
.due{font-size:.78rem;font-weight:500;white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.due.over{color:var(--red)}.due.today{color:var(--amber)}.due.soon{color:var(--brass)}.due.later,.due.none{color:var(--ink-3)}.due.done{color:var(--ink-3);text-decoration:line-through}

/* Fortschritt und Noten */
.squares{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.squares i{width:8px;height:8px;border-radius:50%;background:var(--card-3);display:block}
.squares i.on{background:var(--brass-fill);box-shadow:0 0 6px rgba(90,174,252,.55)}
.grade{display:inline-block;font-family:var(--f-mono);font-weight:600;font-size:.95rem;line-height:1.5;color:var(--ink);background:var(--card-3);border:1px solid var(--line-2);border-radius:8px;padding:0 8px}
.grade.target{color:var(--ink-3);font-weight:500;font-size:.78rem;background:transparent}
.bar{height:6px;border-radius:999px;background:var(--card-3);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--grad);border-radius:999px}

/* Heute mit Uhr */
.today-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:16px}
.aclock{width:88px;height:88px;display:block}
.aclock .face{fill:var(--field);stroke:var(--line-2);stroke-width:1.2}
.aclock .tick{stroke:var(--ink-3);stroke-width:1.2;stroke-linecap:round}
.aclock .tick.major{stroke:var(--ink-2);stroke-width:2.2}
.aclock .hh{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round}
.aclock .hm{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.aclock .hs{stroke:var(--brass);stroke-width:1.1;stroke-linecap:round}
.aclock .hub{fill:var(--brass)}
.today-day{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.today-date{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.1;margin:4px 0 5px;letter-spacing:-.035em}
.today-time{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slotrow{display:flex;flex-direction:column;gap:2px;padding:8px 10px 8px 13px;border-radius:10px;background:var(--card-2);box-shadow:inset 2px 0 0 var(--sc,var(--line-2))}
.slotrow .t{font-family:var(--f-mono);font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.slotrow .n{font-weight:500;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.slotrow .n small{display:block;font-weight:400;color:var(--ink-3)}
.slotrow.past{opacity:.5}
.slotrow.live{background:var(--brass-soft)}
.dueline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* Schnell anlegen */
.qa{display:flex;flex-direction:column;gap:2px;margin:-4px -6px}
.qa-b{appearance:none;border:0;background:transparent;color:var(--ink-2);display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;cursor:pointer;font-weight:500;text-align:left;width:100%}
.qa-b:hover{background:var(--card-2);color:var(--ink)}
.qa-i{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;background:var(--card-2);border:1px solid var(--line);color:var(--ink-3);flex:none}
.qa-i svg{width:15px;height:15px}
.qa-b:hover .qa-i{color:var(--brass);border-color:var(--line-2)}
@media (max-width:899px){.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:0}.qa-b{border:1px solid var(--line);border-radius:10px;padding:5px 12px 5px 5px;font-size:.86rem}.qa-i{width:24px;height:24px;border:0}}

/* Profil */
.kvl{margin:0;display:flex;flex-direction:column}
.kvl div{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kvl div:last-child{border-bottom:0;padding-bottom:0}
.kvl dt{color:var(--ink-3);font-size:.82rem}
.kvl dd{margin:0;font-weight:500;font-size:.88rem;overflow-wrap:anywhere}

/* Fokus-Timer */
.pomo-modes{display:flex;width:100%}
.pomo-modes button{flex:1}
.pomo-ring{position:relative;width:min(188px,100%);aspect-ratio:1;max-width:100%;margin:18px auto 6px}
.pomo-ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pomo-ring .rt{fill:none;stroke:var(--card-3);stroke-width:6}
.pomo-ring .rp{fill:none;stroke:url(#pomoGrad);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 6px rgba(124,170,255,.45))}
.pomo-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.pomo-time{font-family:var(--f-mono);font-weight:500;font-size:2.4rem;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1}
.pomo-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.pomo-count{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px}

/* Zeit */
.prog{display:flex;flex-direction:column;gap:12px}
.prog-row{display:grid;grid-template-columns:5.6em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:.84rem}
.prog-row b{font-weight:500;color:var(--ink-2)}
.prog-row .pc{text-align:right;font-family:var(--f-mono);font-size:.76rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* Kurse */
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.ccard{appearance:none;text-align:left;cursor:pointer;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0;color:var(--ink);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.ccard:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:0 18px 40px -24px rgba(0,0,0,.9),0 0 0 1px color-mix(in srgb,var(--sc,var(--ink-3)) 25%,transparent)}
.ccover{display:block;height:96px;color:var(--sc,var(--ink-2));border-bottom:1px solid var(--line);background:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px) 0 0/14px 14px,var(--field);background:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px) 0 0/14px 14px,radial-gradient(120% 130% at 18% 0%,color-mix(in srgb,var(--sc,var(--ink-3)) 20%,transparent),transparent 62%),var(--field)}
.ccover svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--sc,#fff) 35%,transparent))}
.ccover .ln{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ccover .tx{fill:currentColor;stroke:none;font-family:var(--f-mono);font-style:normal}
.ccover .mono{font-family:var(--f-mono)}
.ccover .soft{opacity:.45}
.ccover .wash{fill:currentColor;stroke:none;opacity:.08}
.cbody{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;flex:1;min-width:0}
.ccard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.ccard .name{display:block;font-family:var(--f-display);font-weight:600;font-size:.98rem;line-height:1.28;letter-spacing:-.015em;overflow-wrap:anywhere}
.ccard .meta{display:block;color:var(--ink-3);font-size:.8rem}
.ccard .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:auto;padding-top:8px}
.ccard .foot .count{font-size:.74rem;color:var(--ink-3)}
.prog-dots{display:flex;flex-direction:column;gap:6px}
.filters{display:flex;gap:6px;flex-wrap:wrap}

/* Listen */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow input[type=checkbox]{width:17px;height:17px;accent-color:var(--brass-fill);margin:0;cursor:pointer}
.trow .tt{min-width:0;overflow-wrap:anywhere;cursor:pointer}
.trow.isdone .tt{text-decoration:line-through;color:var(--ink-3)}
.trow .tm{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:-1px}
.trow .tm:empty{display:none}
.trow .end{display:flex;gap:4px;align-items:center}

/* Ziele */

/* Prüfungen */
.exam{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}

/* Notizen */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.note{appearance:none;text-align:left;cursor:pointer;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--ink)}

/* Kalender */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.ev{border-radius:8px;padding:6px 8px;font-size:.8rem;line-height:1.3;border:1px solid var(--line-2);background:var(--card-3);min-width:0;overflow-wrap:anywhere}

.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mhead{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);padding:2px 6px}

.mi.ex{background:var(--red);color:#1a0b0c}
.mi.tk{color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.mcell .dots{display:none;gap:3px}
.mcell .dots i{width:6px;height:6px;border-radius:50%;background:var(--brass)}
.mcell .dots i.ex{background:var(--red)}.mcell .dots i.tk{background:var(--ink-3)}
@media (max-width:700px){.mcell{min-height:52px}.mcell .mi{display:none}.mcell .dots{display:flex;flex-wrap:wrap}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-3);margin-top:12px}

/* Noten */
.bignum{font-family:var(--f-display);font-weight:700;font-size:2.5rem;line-height:1;letter-spacing:-.05em}

.music{display:flex;flex-wrap:wrap;gap:18px 22px}

.cover{--h:210;width:80px;max-width:100%;aspect-ratio:1;border-radius:12px;display:grid;align-items:end;justify-items:start;padding:8px 10px;color:var(--on-cover);flex:none;box-shadow:0 10px 30px -12px hsl(var(--h) 70% 40% / .6);
  background-color:hsl(var(--h) 45% 30%);
  background-image:linear-gradient(var(--cover-line) 1px,transparent 1px),linear-gradient(90deg,var(--cover-line) 1px,transparent 1px),linear-gradient(140deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 55) 62% 22%));
  background-size:11px 11px,11px 11px,auto}

/* Seitenpanel */
.sheet{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end;background:var(--scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

}

.linkbtn:hover{color:var(--brass)}

.deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.deck:last-child{border-bottom:0}
.deck b{font-weight:500}
.rd{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rd:last-child{border-bottom:0}
.rd-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:.86rem;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .bar{grid-column:1/-1}
.rows{display:flex;flex-direction:column;gap:8px}
.rowed{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.rowed .c{display:flex;flex-direction:column;gap:3px;min-width:0}
.rowed .c.wide{grid-column:span 2}
.rowed .c>span{font-size:.64rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.rowed input:not([type=checkbox]),.rowed select{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:6px 8px;width:100%;min-width:0;font-size:.84rem}
.rowed .c.chk{flex-direction:row;align-items:center;gap:7px;padding-bottom:7px}
.rowed .c.chk>span{font-size:.8rem;text-transform:none;letter-spacing:0;color:var(--ink-2)}
.rowed .c.chk input{width:16px;height:16px;accent-color:var(--brass-fill);margin:0}
.rowed [data-row-del]{justify-self:end}
.fieldset-h{grid-column:1/-1;font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.ugroups{display:flex;flex-wrap:wrap;gap:6px}
.ugroups .btn{white-space:normal;text-align:left}
.ugroups .btn[aria-pressed="true"]{background:var(--brass-soft);border-color:rgba(124,200,255,.45);color:var(--ink)}
.linkrow{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.nextbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--brass-soft);border:1px solid rgba(124,200,255,.2);margin-bottom:14px}
.nextbox svg{width:18px;height:18px;color:var(--brass)}
.nextbox b{display:block;font-weight:500}
.nextbox span{font-size:.82rem;color:var(--ink-2)}
.toast{display:flex;align-items:center;gap:12px}
.toast-act{appearance:none;border:0;background:transparent;color:var(--brass);font-weight:600;cursor:pointer;padding:2px 4px;white-space:nowrap}
.ev.sh{background:var(--amber-soft);border-color:rgba(255,194,77,.25)}
.ev.fr{background:var(--brass-soft);border-color:rgba(124,200,255,.25)}
.ev.pj{background:var(--card-2);box-shadow:inset 2px 0 0 var(--s-prof)}
.ev.cancel{opacity:.6}
.ev.cancel button{text-decoration:line-through}

.mi.fr{background:var(--brass-soft);color:var(--brass)}
.mi.pj{color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.mcell .dots i.sh{background:var(--amber)}
.mcell .dots i.fr,.mcell .dots i.pj{background:var(--ink-2)}

.chk-line{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-2);cursor:pointer}
.chk-line input{width:16px;height:16px;accent-color:var(--brass-fill);margin:0}

.pomo-sel{max-width:100%;border:1px solid var(--line-2);background:var(--field);border-radius:10px;padding:6px 10px;font-size:.84rem}
.pomo-count{flex-wrap:wrap}
.semchip.sync{appearance:none;font:inherit;font-size:.8rem;cursor:pointer}
.semchip.sync:hover{color:var(--ink);border-color:var(--ink-3)}
.semchip.sync.s-warn::before{background:var(--amber);box-shadow:0 0 0 3px rgba(255,194,77,.15)}
.semchip.sync.s-err::before{background:var(--red);box-shadow:0 0 0 3px rgba(255,107,107,.15)}
.semchip.sync.s-busy::before{background:var(--brass);box-shadow:0 0 0 3px rgba(124,200,255,.15);animation:syncpulse .8s ease-in-out infinite alternate}
@keyframes syncpulse{from{opacity:1}to{opacity:.25}}

@container (max-width:440px){.arow{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}.arow>.at{grid-row:span 2}.arow>.due,.arow>.pill{justify-self:end;min-width:0!important}}

const LS_DATA = "studienos.v1", LS_UI = "studienos.ui", LS_POMO = "studienos.pomo";

/* ---------- Zustand ---------- */
const state = {...Object.fromEntries(COLS.map(c => [c, []])), settings:{...DEFAULT_SETTINGS}};
const ui = Object.assign({termFilter:"aktuell", icsShifts:true, pomoCourse:"", tab:"uebersicht", taskView:"liste", calView:"woche", courseFilter:"Alle", taskFilter:"offen", assignFilter:"offen"}, ls.get(LS_UI) || {});
try { const h = (location.hash || "").slice(1); if (TABS.some(t => t.id === h)) ui.tab = h; } catch(e){}
if (!TABS.some(t => t.id === ui.tab)) ui.tab = "uebersicht";
let calAnchor = new Date();

const store = { mode:"loading", db:null, canWrite:true, canWriteKnown:null, loaded:new Set(), settingsLoaded:false };
const isReady = () => store.mode === "local" || (store.mode === "db" && store.settingsLoaded && COLS.every(c => store.loaded.has(c)));

/* ---------- Speicher ---------- */
const chains = new Map();
function queued(key, fn){
  const prev = chains.get(key) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  chains.set(key, next);
  next.finally(() => { if (chains.get(key) === next) chains.delete(key); }).catch(() => {});
  return next;
}
async function withRetry(fn){
  try { return await fn(); }
  catch(e){ if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random()*700)); return fn(); } throw e; }
}
function cleanBody(obj){ const o = {...obj}; delete o.id; return JSON.parse(JSON.stringify(o)); }
function onWriteError(e){
  const code = e && e.code;
  if (code === "quota_exceeded") toast("Der Speicher ist voll. Lösche alte Einträge, zum Beispiel erledigte Aufgaben, dann geht es weiter.", true);
  else if (code === "invalid_argument" || code === "revoked" || code === "not_granted") {
    if (store.canWriteKnown !== true) { store.canWrite = false; renderBanner(); }
    toast("Speichern wurde abgelehnt. Mit diesem Zugang kannst du hier nur lesen.", true);
  } else toast("Gerade keine Verbindung zum Speicher. Versuch es gleich noch einmal.", true);
  return false;
}
function saveLocal(){ ls.set(LS_DATA, {...Object.fromEntries(COLS.map(c => [c, state[c]])), settings:state.settings}); }
function loadLocal(){
  const d = ls.get(LS_DATA);
  if (d) { COLS.forEach(c => { if (Array.isArray(d[c])) state[c] = d[c]; }); if (d.settings) state.settings = {...DEFAULT_SETTINGS, ...d.settings}; }
}
function stillLoading(){
  if (store.mode === "loading" || (store.mode === "db" && !store.settingsLoaded)) { toast("Einen Moment, deine Daten werden noch geladen."); return true; }
  return false;
}
async function put(col, obj){
  if (stillLoading()) return false;
  if (!store.canWrite) { toast("Nur Ansicht: Änderungen werden hier nicht gespeichert."); return false; }
  const id = obj.id, body = cleanBody(obj);
  if (store.mode === "db") {
    return queued(col + "/" + id, async () => { await withRetry(() => store.db.collection(col).doc(id).set(body)); return true; }).catch(onWriteError);
  }
  const arr = state[col], i = arr.findIndex(x => x.id === id), rec = {...body, id};
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  saveLocal(); syncMark(col, id); scheduleRender(); return true;
}
async function remove(col, id){
  if (stillLoading()) return false;
  if (!store.canWrite) { toast("Nur Ansicht: Änderungen werden hier nicht gespeichert."); return false; }
  if (store.mode === "db") {
    return queued(col + "/" + id, async () => { await withRetry(() => store.db.collection(col).doc(id).delete()); return true; }).catch(onWriteError);
  }
  state[col] = state[col].filter(x => x.id !== id); saveLocal(); syncMark(col, id); scheduleRender(); return true;
}
async function putSettings(s){
  if (stillLoading()) return false;
  if (!store.canWrite) { toast("Nur Ansicht: Änderungen werden hier nicht gespeichert."); return false; }
  const body = cleanBody(s);
  if (store.mode === "db") {
    return queued("settings/main", async () => { await withRetry(() => store.db.doc("settings/main").set(body)); return true; }).catch(onWriteError);
  }
  state.settings = {...DEFAULT_SETTINGS, ...body}; saveLocal(); syncMark("settings", "main"); renderAll(); return true;
}

/* ---------- Konto und Abgleich (nur eigenständige Version, über Supabase) ----------
   Offline zuerst: Jede Änderung landet sofort im Gerät und wird als „offen“ vermerkt.
   Beim Abgleich holt die App neuere Einträge aus dem Konto und schickt die offenen hoch.
   Gelöschtes bleibt als Grabstein (deleted) im Konto, damit andere Geräte es auch löschen. */
const CFG = (typeof window.STUDIENOS_CONFIG === "object" && window.STUDIENOS_CONFIG) || null;
const STANDALONE = !!CFG;
const LS_SYNC = "studienos.sync", LS_AUTH = "studienos.auth", LS_CFG = "studienos.cfg";
const SYNC = Object.assign({pending:{}, lastPull:null, owner:null}, (STANDALONE && ls.get(LS_SYNC)) || {});
const SR = {state:"off", busy:false, again:false, timer:null, err:"", seq:0, choice:null, lastOk:null, session:null, refreshing:null, listening:false};
const saveSync = () => ls.set(LS_SYNC, {pending:SYNC.pending, lastPull:SYNC.lastPull, owner:SYNC.owner});
const pendingCount = () => Object.keys(SYNC.pending).length;
function syncCfg(){
  const own = ls.get(LS_CFG) || {};
  const fromFile = !!(CFG && CFG.supabaseUrl && CFG.supabaseKey);
  const url = String((fromFile ? CFG.supabaseUrl : own.supabaseUrl) || "").trim().replace(/\/+$/, "");
  const key = String((fromFile ? CFG.supabaseKey : own.supabaseKey) || "").trim();
  return (/^https:\/\/[^/\s]+$/.test(url) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(url)) && key.length > 20 ? {url, key, fromFile} : null;
}
function syncMark(col, id){
  if (!STANDALONE) return;
  SYNC.pending[col + "/" + id] = Date.now() + "." + (++SR.seq); saveSync(); renderSyncChip();
  if (SR.session) { clearTimeout(SR.timer); SR.timer = setTimeout(syncNow, 1500); }
}

/* Supabase per fetch: Auth (GoTrue) und Tabelle items (PostgREST) */
async function sbFetch(path, opt = {}, auth = true, retried = false){
  const cfg = syncCfg(); if (!cfg) throw Object.assign(new Error("nocfg"), {kind:"nocfg"});
  const headers = {apikey:cfg.key, "Content-Type":"application/json", ...(opt.headers || {})};
  if (auth) headers.Authorization = "Bearer " + await accessToken();
  let res;
  try { res = await fetch(cfg.url + path, {method:opt.method || "GET", headers, body:opt.body, cache:"no-store"}); }
  catch(e){ throw Object.assign(new Error("offline"), {kind:"offline"}); }
  if (res.status === 401 && auth && !retried) { await refreshSession(); return sbFetch(path, opt, auth, true); }
  const txt = await res.text(); let body = null;
  if (txt) { try { body = JSON.parse(txt); } catch(e){ body = txt; } }
  if (!res.ok) {
    const b = body && typeof body === "object" ? body : {};
    throw Object.assign(new Error(String(b.msg || b.message || b.error_description || b.error || ("HTTP " + res.status))), {kind:"http", status:res.status, code:b.code || b.error_code || b.error || ""});
  }
  return body;
}
function setSession(r){
  if (r && r.access_token) {
    const prevUser = SR.session && SR.session.user;
    SR.session = {access_token:r.access_token, refresh_token:r.refresh_token || (SR.session && SR.session.refresh_token) || "",
      expires_at:Number(r.expires_at) || Math.floor(Date.now() / 1000) + (Number(r.expires_in) || 3600),
      user:r.user && r.user.id ? {id:r.user.id, email:r.user.email || ""} : prevUser || null};
  } else SR.session = null;
  ls.set(LS_AUTH, SR.session);
}
async function accessToken(){
  if (!SR.session) throw Object.assign(new Error("signedout"), {kind:"signedout"});
  if (SR.session.expires_at * 1000 - Date.now() < 90000) await refreshSession();
  return SR.session.access_token;
}
async function refreshSession(){
  if (!SR.refreshing) SR.refreshing = (async () => {
    const s = SR.session; if (!s || !s.refresh_token) throw Object.assign(new Error("signedout"), {kind:"signedout"});
    try { setSession(await sbFetch("/auth/v1/token?grant_type=refresh_token", {method:"POST", body:JSON.stringify({refresh_token:s.refresh_token})}, false)); }
    catch(e){
      if (e.kind === "http" && e.status >= 400 && e.status < 500) { setSession(null); throw Object.assign(new Error("signedout"), {kind:"signedout"}); }
      throw e;
    }
  })().finally(() => { SR.refreshing = null; });
  return SR.refreshing;
}
async function ensureUser(){
  if (SR.session && SR.session.user && SR.session.user.id) return;
  const u = await sbFetch("/auth/v1/user");
  SR.session.user = {id:u.id, email:u.email || ""}; ls.set(LS_AUTH, SR.session);
}
async function syncLogin(email, password){
  setSession(await sbFetch("/auth/v1/token?grant_type=password", {method:"POST", body:JSON.stringify({email, password})}, false));
  onSignedIn();
}
async function syncSignup(email, password){
  const back = location.origin + location.pathname;
  const r = await sbFetch("/auth/v1/signup?redirect_to=" + encodeURIComponent(back), {method:"POST", body:JSON.stringify({email, password})}, false);
  if (r && r.access_token) { setSession(r); onSignedIn(); return "in"; }
  return "confirm";
}
async function syncLogout(){
  if (SR.session) { try { await sbFetch("/auth/v1/logout", {method:"POST"}); } catch(e){} }
  setSession(null); SR.choice = null; SR.state = "out"; SR.err = ""; renderSyncChip(); renderBanner();
}
/* Nach dem Bestätigungslink aus der E-Mail steht die Sitzung in der Adresse */
function sessionFromHash(){
  const h = location.hash || "";
  if (!/(access_token|error_description)=/.test(h)) return;
  const p = new URLSearchParams(h.slice(1));
  if (p.get("error_description")) setTimeout(() => toast("Supabase meldet: " + p.get("error_description").replace(/\+/g, " "), true), 400);
  if (p.get("access_token") && p.get("refresh_token")) {
    let user = null;
    try { let s = p.get("access_token").split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); s += "===".slice((s.length + 3) % 4); const pl = JSON.parse(atob(s)); user = {id:pl.sub, email:pl.email || ""}; } catch(e){}
    setSession({access_token:p.get("access_token"), refresh_token:p.get("refresh_token"), expires_at:Number(p.get("expires_at")) || 0, expires_in:Number(p.get("expires_in")) || 3600, user});
    setTimeout(() => toast("E-Mail bestätigt, du bist angemeldet."), 400);
  }
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
}

/* Datenabgleich */
const tms = s => { const t = Date.parse(String(s || "").replace(/(\.\d{3})\d+/, "$1")); return Number.isFinite(t) ? t : 0; };
function maxStamp(rows, prev){ let best = prev || null, bt = tms(prev); rows.forEach(r => { const t = tms(r.updated_at); if (t > bt) { bt = t; best = r.updated_at; } }); return best; }
const stable = v => Array.isArray(v) ? "[" + v.map(stable).join(",") + "]" : (v && typeof v === "object") ? "{" + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}" : JSON.stringify(v === undefined ? null : v);
const localCount = () => COLS.reduce((n, c) => n + state[c].length, 0);
async function pullRows(since){
  const out = [], page = 1000, me = SR.session.user.id;
  for (let off = 0; ; off += page) {
    const q = `/rest/v1/items?select=col,id,data,deleted,updated_at&user_id=eq.${encodeURIComponent(me)}` + (since ? `&updated_at=gt.${encodeURIComponent(since)}` : "") + `&order=updated_at.asc,col.asc,id.asc&limit=${page}&offset=${off}`;
    const data = await sbFetch(q);
    if (!Array.isArray(data)) break;
    out.push(...data); if (data.length < page) break;
  }
  return out;
}
function applyRow(r){
  if (!r || typeof r.col !== "string") return false;
  if (r.col === "settings") {
    if (r.deleted || !r.data || typeof r.data !== "object") return false;
    const next = {...DEFAULT_SETTINGS, ...r.data};
    if (stable(next) === stable(state.settings)) return false;
    state.settings = next; return true;
  }
  if (!COLS.includes(r.col) || !SEG_OK.test(String(r.id || ""))) return false;
  const arr = state[r.col], i = arr.findIndex(x => x.id === r.id);
  if (r.deleted) { if (i < 0) return false; arr.splice(i, 1); return true; }
  const rec = {...(r.data && typeof r.data === "object" ? r.data : {}), id:String(r.id)};
  if (i >= 0) { if (stable(arr[i]) === stable(rec)) return false; arr[i] = rec; } else arr.push(rec);
  return true;
}
function markAllLocal(){
  COLS.forEach(c => state[c].forEach(x => { SYNC.pending[c + "/" + x.id] = "init"; }));
  SYNC.pending["settings/main"] = "init";
}
function replaceWithRemote(rows){
  COLS.forEach(c => { state[c] = []; }); state.settings = {...DEFAULT_SETTINGS};
  rows.forEach(r => { if (!r.deleted) applyRow(r); });
  SYNC.pending = {};
}
function mergeWithRemote(rows){
  const stamp = x => (x && (Number(x.updatedAt) || Number(x.createdAt))) || 0;
  rows.forEach(r => {
    if (r.deleted) return;
    if (r.col === "settings") { applyRow(r); return; }
    const loc = (state[r.col] || []).find(x => x.id === r.id);
    if (!loc || stamp(r.data) > stamp(loc)) applyRow(r);
  });
  markAllLocal();
}
async function pushPending(){
  const snap = {...SYNC.pending}, keys = Object.keys(snap); if (!keys.length) return;
  const me = SR.session.user.id;
  const rows = keys.map(k => {
    const j = k.indexOf("/"), col = k.slice(0, j), id = k.slice(j + 1);
    if (col === "settings") return {user_id:me, col, id:"main", data:cleanBody(state.settings), deleted:false};
    const rec = (state[col] || []).find(x => x.id === id);
    return rec ? {user_id:me, col, id, data:cleanBody(rec), deleted:false} : {user_id:me, col, id, data:{}, deleted:true};
  });
  for (let i = 0; i < rows.length; i += 200) {
    await sbFetch("/rest/v1/items?on_conflict=user_id,col,id", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify(rows.slice(i, i + 200))});
  }
  keys.forEach(k => { if (SYNC.pending[k] === snap[k]) delete SYNC.pending[k]; });
  saveSync();
}
async function syncNow(){
  if (!STANDALONE || !SR.session || SR.choice || !syncCfg()) return;
  if (SR.busy) { SR.again = true; return; }
  SR.busy = true; SR.state = "busy"; renderSyncChip(); updateSyncStatus();
  try {
    do {
      SR.again = false;
      await ensureUser();
      const me = SR.session.user.id;
      if (SYNC.owner !== me) {
        // Erster Abgleich dieses Kontos auf diesem Gerät
        const rows = await pullRows(null), live = rows.filter(r => !r.deleted);
        const localN = localCount();
        if (live.length && localN) {
          SR.choice = {rows, local:localN, remote:live.filter(r => r.col !== "settings").length};
          SR.state = "choice"; return;
        }
        if (live.length) replaceWithRemote(rows); else markAllLocal();
        SYNC.owner = me; SYNC.lastPull = maxStamp(rows, null); saveSync(); saveLocal(); scheduleRender();
      } else {
        const since = SYNC.lastPull ? new Date(tms(SYNC.lastPull) - 120000).toISOString() : null;
        const rows = await pullRows(since);
        let changed = false;
        for (const r of rows) { if (SYNC.pending[r.col + "/" + r.id]) continue; if (applyRow(r)) changed = true; }
        SYNC.lastPull = maxStamp(rows, SYNC.lastPull); saveSync();
        if (changed) { saveLocal(); scheduleRender(); }
      }
      await pushPending();
    } while (SR.again);
    SR.state = "ok"; SR.err = ""; SR.lastOk = new Date();
  } catch(e){
    SR.state = e.kind === "offline" ? "offline" : e.kind === "signedout" ? "out" : "error";
    SR.err = syncErrText(e);
  } finally {
    SR.busy = false; renderSyncChip(); renderBanner(); updateSyncStatus();
    if (SR.state === "choice" || SR.state === "out") refreshSettings();
  }
}
function resolveChoice(kind){
  const c = SR.choice; if (!c || !SR.session) return;
  SR.choice = null;
  if (kind === "remote") replaceWithRemote(c.rows); else mergeWithRemote(c.rows);
  SYNC.owner = SR.session.user.id; SYNC.lastPull = maxStamp(c.rows, null); saveSync(); saveLocal();
  renderAll(); refreshSettings(); syncNow();
  toast(kind === "remote" ? "Dieses Gerät zeigt jetzt die Einträge aus deinem Konto." : "Zusammengeführt. Alles wird hochgeladen.");
}
function syncErrText(e){
  if (!e) return "";
  if (e.kind === "offline") return navigator.onLine === false ? "Du bist offline. Abgeglichen wird, sobald du wieder Netz hast." : "Supabase ist gerade nicht erreichbar. Falls dein Projekt pausiert ist: im Supabase-Dashboard „Restore project“ wählen.";
  if (e.kind === "signedout") return "Du bist abgemeldet. Melde dich wieder an.";
  const code = String(e.code || ""), msg = String(e.message || "");
  if (code === "42P01" || code === "PGRST205" || /does not exist|Could not find the table/i.test(msg)) return "In deinem Supabase-Projekt fehlt die Tabelle. Führe das SQL aus der Anleitung einmal aus.";
  if (code === "42501" || e.status === 403) return "Supabase lehnt den Zugriff ab. Prüf, ob das SQL aus der Anleitung vollständig gelaufen ist.";
  if (e.status === 404) return "Unter dieser Supabase-Adresse gibt es nichts. Prüf die Adresse.";
  if (e.status >= 500) return "Supabase hat einen Fehler gemeldet. Versuch es gleich noch einmal.";
  return "Abgleich ging nicht: " + msg.slice(0, 140);
}
function authErrText(e){
  const m = String((e && e.message) || ""), c = String((e && e.code) || ""), all = m + " " + c;
  if (e && e.kind === "offline") return "Keine Verbindung zu Supabase.";
  if (/invalid login credentials|invalid_credentials/i.test(all)) return "E-Mail oder Passwort stimmt nicht.";
  if (/email not confirmed|email_not_confirmed/i.test(all)) return "Bestätige zuerst den Link in der E-Mail von Supabase.";
  if (/already registered|user_already_exists/i.test(all)) return "Für diese E-Mail gibt es schon ein Konto. Melde dich an.";
  if (/signups? not allowed|signup_disabled/i.test(all)) return "Neue Konten sind in deinem Supabase-Projekt abgeschaltet.";
  if (/weak_password|password should|at least \d+ characters/i.test(all)) return "Das Passwort ist zu kurz oder zu einfach. Nimm mindestens 8 Zeichen.";
  if (/rate limit|too many|over_email_send_rate_limit/i.test(all)) return "Zu viele Versuche. Warte ein paar Minuten.";
  if (/invalid api key|no api key|unregistered api key/i.test(all)) return "Der Supabase-Schlüssel stimmt nicht.";
  return m || "Das ging nicht.";
}
function syncInit(){
  sessionFromHash();
  if (!SR.session) SR.session = ls.get(LS_AUTH) || null;
  if (!syncCfg()) { SR.state = "nocfg"; renderSyncChip(); renderBanner(); return; }
  if (SR.session) onSignedIn(); else { SR.state = "out"; renderSyncChip(); renderBanner(); }
  if (SR.listening) return;
  SR.listening = true;
  addEventListener("online", () => syncNow());
  addEventListener("offline", () => { if (SR.session && !SR.choice) { SR.state = "offline"; SR.err = syncErrText({kind:"offline"}); renderSyncChip(); updateSyncStatus(); } });
  addEventListener("focus", () => syncNow());
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
  setInterval(() => { if (document.visibilityState === "visible") syncNow(); }, 30000);
}
function onSignedIn(){
  const me = SR.session && SR.session.user && SR.session.user.id;
  if (me && SYNC.owner && SYNC.owner !== me) { SYNC.owner = null; SYNC.lastPull = null; saveSync(); }
  SR.state = "busy"; renderSyncChip(); renderBanner(); syncNow();
}

/* Anzeige */
function syncStatusText(){
  const n = pendingCount(), w = n ? ` ${n} ${n === 1 ? "Änderung wartet" : "Änderungen warten"}.` : "";

/* Konflikte der nächsten 8 Tage: Schicht gegen Uni, späte Schicht vor frühem Termin, Fristen in der Schicht */
function warnings(){
  const out = [], seen = new Set(), push = (k, text) => { if (!seen.has(k)) { seen.add(k); out.push(text); } };
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), cm = courseMap();
  const timedOn = d => {
    const ev = lecturesOn(d).filter(l => !l.cancelled).map(l => ({s:l.s, what:`${shortName(l.course)} (${KIND_LONG[l.kind] || l.kind || "Termin"})`}));
    state.exams.filter(e => e.date === d && e.time).forEach(e => ev.push({s:toMin(e.time), what:`Prüfung ${shortName(cm[e.courseId])}`}));
    return ev.filter(x => x.s !== null).sort((a, b) => a.s - b.s);
  };
  for (let i = 0; i < 8; i++) {
    const d = iso(addDays(now, i)), nd = iso(addDays(now, i + 1));
    for (const sh of shiftsOn(d)) {
      if (i === 0 && sh.e < nowMin) continue;
      for (const ev of timedOn(d)) if (ev.s < sh.e && ev.s + 75 > sh.s) push(`o${sh.id}${ev.s}`, `${dayLabel(d)}: Schicht ${shiftTime(sh)} überschneidet sich mit ${ev.what} um ${fromMin(ev.s)}.`);
      if (sh.e >= 23 * 60) {
        const first = timedOn(nd)[0];
        if (first && first.s + 1440 - sh.e < 9 * 60) push(`r${sh.id}`, `${dayLabel(d)} Schicht bis ${fromMin(sh.e)}, ${dayLabel(nd).replace(/^Morgen$/, "am nächsten Morgen")} schon ${first.what} um ${fromMin(first.s)}.`);
      }
      const dues = [];
      state.assignments.filter(a => a.status !== "abgegeben" && a.due === d).forEach(a => dues.push({k:"a" + a.id, title:`Abgabe „${a.title}“`, m:toMin(a.dueTime || "23:59")}));
      state.deadlines.filter(x => !x.done && x.date === d).forEach(x => dues.push({k:"d" + x.id, title:`Frist „${x.title}“`, m:toMin(x.time || "23:59")}));
      dues.forEach(x => { if (x.m !== null && x.m >= sh.s - 30) push(x.k, `${x.title} ist ${dayLabel(d).toLowerCase() === "heute" ? "heute" : "am " + dayLabel(d)} um ${fromMin(x.m)} fällig, du arbeitest ab ${fromMin(sh.s)}. Vorher abgeben.`); });
    }
  }

function scheduleRender(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; renderView(); refreshSheet(); renderHeader(); }); }
function renderAll(){ renderHeader(); renderTabs(); renderBanner(); renderView(); }
const lpDone = () => state.courses.filter(c => c.status === "bestanden").reduce((a, c) => a + (num(c.lp) || 0), 0);
function renderHeader(){
  const s = S(), now = new Date(), t = iso(now);
  $("#brandName").textContent = s.name ? `${s.name}${/[sßxz]$/i.test(s.name) ? "’" : "s"} Studien-OS` : "Studien-OS";
  $("#brandSub").textContent = s.program || "Kurse, Aufgaben, Abgaben und Prüfungen an einem Ort.";
  const chip = $("#semchip"), lw = lectureWeek(now), reason = dayReason(t);
  chip.className = "semchip";
  if (inRange(t, s.examStart, s.examEnd)) { chip.classList.add("exam"); chip.textContent = `${curTerm()} · Prüfungszeitraum`; }
  else if (typeof lw.cur === "number") chip.textContent = `${curTerm()} · Vorlesungswoche ${lw.cur} von ${lw.total}`;
  else { chip.classList.add("free"); chip.textContent = `${curTerm()} · ${lw.cur === "break" ? "Vorlesungsfrei" : (reason || "Vorlesungsfrei")}`; }

  renderSyncChip();
}
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-selected="${ui.tab===t.id}">${ICON[TAB_ICON[t.id]] || ""}<span>${t.label}</span></button>`).join("");
}
function renderBanner(){
  const b = $("#banner");
  if (STANDALONE) { const h = syncBanner(); b.hidden = !h; if (h) { b.className = "banner"; b.innerHTML = h; } return; }
  if (store.mode === "local") { b.hidden = false; b.className = "banner"; b.innerHTML = `<span><b>Nur in diesem Browser gespeichert.</b> Öffne die Seite angemeldet in claude.ai, dann sind deine Einträge auf Laptop und Handy dieselben.</span>`; }
  else if (!store.canWrite) { b.hidden = false; b.className = "banner"; b.innerHTML = `<span><b>Nur Ansicht.</b> Änderungen speichern kann nur, wem diese Seite gehört.</span>`; }
  else b.hidden = true;
}

/* ---------- Render: Ansichten ---------- */
function captureFocus(){
  const a = document.activeElement;
  if (!a || !a.id || !$("#view").contains(a)) return null;
  return {id:a.id, value:a.value, start:a.selectionStart, end:a.selectionEnd};
}
function restoreFocus(f){
  if (!f) return; const el = document.getElementById(f.id); if (!el) return;
  if (typeof f.value === "string" && "value" in el && el.type !== "checkbox") el.value = f.value;
  el.focus({preventScroll:true});
  try { if (f.start !== null && f.start !== undefined) el.setSelectionRange(f.start, f.end); } catch(e){}
}
function renderView(){
  const f = captureFocus(), v = $("#view");
  const map = {uebersicht:viewOverview, kurse:viewCourses, aufgaben:viewTasks, kalender:viewCalendar, lernen:viewLearn, noten:viewGrades};
  v.innerHTML = (map[ui.tab] || viewOverview)();
  v.setAttribute("aria-labelledby", "tab-" + ui.tab);
  decorate(v); restoreFocus(f); syncMusicInput(); updatePomo(); tickClock();
}
const loadingCard = () => `<p class="loading">Deine Einträge werden geladen …</p>`;
const emptyBox = (text, btn) => `<div class="empty"><span>${text}</span>${btn || ""}</div>`;
const addBtn = (col, label, extra) => `<button class="btn sm" data-new="${col}"${extra ? " " + extra : ""}>${ICON.plus}${label}</button>`;

/* Übersicht: drei Spalten; --o ist die Reihenfolge auf dem Handy */
function viewOverview(){
  const sec = (o, id, html, extra) => `<section class="card" style="--o:${o}" aria-labelledby="${id}"${extra ? " " + extra : ""}>${html}</section>`;
  return `<div class="dash">
    <div class="col col-l">${sec(1, "h-today", cardToday(), 'id="todayCard"')}${sec(2, "h-actions", cardActions())}${sec(13, "h-music", cardMusic(), 'id="musicCard"')}</div>
    <div class="col col-m">${sec(7, "h-courses", cardCourses(true))}${sec(5, "h-week", cardWeekTasks())}${sec(6, "h-assign", cardWeekAssignments())}${state.projects.length ? sec(9, "h-projects", cardProjects()) : ""}${sec(10, "h-goals", cardGoals())}</div>
    <div class="col col-r">${sec(3, "h-pomo", cardPomo())}${sec(4, "h-deadlines", cardDeadlines(5))}${sec(8, "h-exams", cardExams(4))}${sec(11, "h-time", cardProgress(), 'id="progCard"')}${sec(12, "h-notes", cardNotes(3))}</div>
  </div>`;
}
function cardActions(){
  const items = [["tasks","Aufgabe","checks"],["assignments","Abgabe","inbox"],["shifts","Schicht","shift"],["deadlines","Frist","alarm"],["notes","Vorlesungsnotiz","note"],["cards","Karteikarte","cards"],["exams","Prüfung","exam"],["projects","Gruppenprojekt","users"]];
  return `<div class="card-h"><h2 id="h-actions">Schnell anlegen</h2></div>
    <div class="qa">${items.map(([col, label, ic]) => `<button class="qa-b" data-new="${col}"><span class="qa-i" aria-hidden="true">${ICON[ic]}</span>${label}</button>`).join("")}</div>`;
}

/* Heute */
function cardToday(){
  const t = todayISO(), now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
  const top = `<div class="today-top">${clockSVG()}<div style="min-width:0"><div class="today-day">${esc(DAYS_LONG[weekdayIdx(t)])}</div><h2 class="today-date" id="h-today">${esc(DF.long.format(now).replace(/^[^,]+,\s*/, ""))}</h2><div class="today-time"><span id="todayClock">${pad(now.getHours())}:${pad(now.getMinutes())}</span> · KW ${isoWeek(now).week}</div></div></div>`;
  if (!isReady()) return top + loadingCard();
  const cm = courseMap(), items = [];
  lecturesOn(t).forEach(l => {
    const cls = l.cancelled ? "cancel" : l.e < mins ? "past" : (mins >= l.s && mins <= l.e ? "live" : "");
    items.push({s:l.s, html:`<li class="slotrow ${SUBJ_CLASS[l.course.subject] || "s-other"} ${cls}"><span class="t">${l.start}–${l.end}${l.ct ? " · c.t." : ""}${cls === "live" ? " · läuft gerade" : ""}${l.cancelled ? " · fällt aus" : ""}</span><span class="n">${esc(shortName(l.course))}<small>${esc([KIND_LONG[l.kind] || l.kind, l.room].filter(Boolean).join(" · "))}${l.roomChanged ? " · anderer Raum" : ""}</small></span></li>`});
  });
  shiftsOn(t).forEach(sh => items.push({s:sh.s, html:`<li class="slotrow shift ${sh.e < mins ? "past" : ""}"><span class="t">${shiftTime(sh)}</span><span class="n">Schicht${sh.label ? " · " + esc(sh.label) : ""}${sh.note ? `<small>${esc(sh.note)}</small>` : ""}</span></li>`}));
  state.exams.filter(e => e.date === t).forEach(e => items.push({s:toMin(e.time) ?? 0, html:`<li class="slotrow exam"><span class="t">${esc(e.time || "ganztägig")}</span><span class="n">Prüfung: ${esc(shortName(cm[e.courseId]))}<small>${esc([e.kind, e.room].filter(Boolean).join(" · "))}</small></span></li>`}));
  items.sort((a, b) => a.s - b.s);
  const reason = dayReason(t);
  let body;
  if (items.length) body = `<ul class="slots">${items.map(x => x.html).join("")}</ul>`;
  else if (reason) body = `<p class="muted" style="margin:0">${esc(reason)}. Keine Termine heute.</p>`;
  else if (!state.courses.some(c => (c.slots || []).length)) body = emptyBox("Trag in deinen Kursen Wochentag, Uhrzeit und Raum ein, dann steht hier jeden Tag dein Stundenplan.", `<button class="btn sm" data-tab="kurse">Zu den Kursen</button>`);
  else body = `<p class="muted" style="margin:0">Heute keine Termine.</p>`;
  const openT = state.tasks.filter(x => x.status !== "erledigt" && validISO(x.due));
  const openA = state.assignments.filter(x => x.status !== "abgegeben" && validISO(x.due));
  const over = [...openT, ...openA].filter(x => x.due < t).length, due = [...openT, ...openA].filter(x => x.due === t).length;
  const bits = [];
  if (over) bits.push(`<button class="pill" style="background:var(--red-soft);color:var(--red)" data-tab="aufgaben">${over} überfällig</button>`);
  if (due) bits.push(`<button class="pill st-arbeit" data-tab="aufgaben">${due} heute fällig</button>`);
  const nCards = cardsDue().length; if (nCards) bits.push(`<button class="pill st-offen" data-review="all">${nCards} ${nCards === 1 ? "Karteikarte" : "Karteikarten"} fällig</button>`);
  const w = warnings();
  return top + `<div class="group-h">Heute</div>` + body + (bits.length ? `<div class="dueline">${bits.join("")}</div>` : "")
    + (w.length ? `<div class="warn" role="note"><div class="warn-h">${ICON.alarm}Achtung</div><ul>${w.slice(0, 3).map(x => `<li>${esc(x)}</li>`).join("")}</ul>${w.length > 3 ? `<p class="small muted" style="margin:6px 0 0">${w.length - 3} weitere im Kalender</p>` : ""}</div>` : "");
}

/* Fokus-Timer mit Lernzeit pro Kurs */
const POMO = {mode:"focus", dur:{focus:25*60, short:5*60, long:15*60}, left:25*60, running:false, endAt:0, timer:null};
const POMO_LABEL = {focus:"Fokus", short:"Kurze Pause", long:"Lange Pause"};
function pomoCount(){ const p = ls.get(LS_POMO); return p && p.date === todayISO() ? (p.count || 0) : 0; }
function cardPomo(){
  const c = pomoCount(), running = state.courses.filter(isRunning);
  if (ui.pomoCourse && !running.some(x => x.id === ui.pomoCourse)) ui.pomoCourse = "";
  const wk = focusMinutes(null, weekStartISO(), weekEnd());
  return `<div class="card-h"><h2 id="h-pomo">Fokus-Timer</h2></div>
    <div class="seg pomo-modes" role="group" aria-label="Timer-Modus">${["focus","short","long"].map(m => `<button data-pomo="${m}" aria-pressed="${POMO.mode===m}">${m==="focus" ? "Fokus 25" : m==="short" ? "Pause 5" : "Pause 15"}</button>`).join("")}</div>
    <div class="pomo-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="pomoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fd6ff"/><stop offset=".55" stop-color="#7f8cff"/><stop offset="1" stop-color="#b07cff"/></linearGradient></defs><circle class="rt" cx="60" cy="60" r="52"/><circle class="rp" id="pomoRing" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 60 60)"/></svg>
      <div class="pomo-c"><div class="pomo-time" id="pomoTime">25:00</div><div class="muted small" id="pomoMode">${POMO_LABEL[POMO.mode]}</div></div></div>
    <div class="pomo-for"><select id="pomo-course" class="pomo-sel" aria-label="Wofür lernst du?"><option value="">Lernzeit ohne Kurs</option>${running.map(co => `<option value="${esc(co.id)}" ${ui.pomoCourse === co.id ? "selected" : ""}>${esc(shortName(co))}</option>`).join("")}</select></div>
    <div class="pomo-row"><button class="btn primary" id="pomoToggle" data-pomo="toggle">${ICON.play}Start</button><button class="btn" data-pomo="reset">${ICON.reset}Zurücksetzen</button></div>
    <div class="pomo-count small muted" title="Fokusrunden heute">Heute ${squares(c, Math.max(4, c))}<span class="sr">${c} Fokusrunden</span><span>· Woche ${fmtHM(wk)}</span></div>`;
}
function updatePomo(){
  const tEl = $("#pomoTime"); if (!tEl) return;
  const total = POMO.dur[POMO.mode], left = POMO.left;
  tEl.textContent = `${pad(Math.floor(left / 60))}:${pad(left % 60)}`;
  const ring = $("#pomoRing"); if (ring) ring.setAttribute("stroke-dashoffset", (100 * left / total).toFixed(2));
  const btn = $("#pomoToggle"); if (btn) btn.innerHTML = POMO.running ? `${ICON.pause}Pause` : `${ICON.play}${left < total ? "Weiter" : "Start"}`;
  const m = $("#pomoMode"); if (m) m.textContent = POMO_LABEL[POMO.mode] + (POMO.running ? " · läuft" : "");
  $$("[data-pomo]").forEach(b => { if (["focus","short","long"].includes(b.dataset.pomo)) b.setAttribute("aria-pressed", String(b.dataset.pomo === POMO.mode)); });
}
async function logFocus(minutes){
  const d = todayISO(), doc = state.focus.find(x => x.id === d) || {id:d, date:d, byCourse:{}, total:0};
  const cid = ui.pomoCourse && state.courses.some(c => c.id === ui.pomoCourse) ? ui.pomoCourse : "_";
  const byCourse = {...(doc.byCourse || {})}; byCourse[cid] = (Number(byCourse[cid]) || 0) + minutes;
  await put("focus", {...doc, id:d, date:d, byCourse, total:(Number(doc.total) || 0) + minutes});
}
function pomoTick(){
  const left = Math.max(0, Math.ceil((POMO.endAt - Date.now()) / 1000));
  if (left !== POMO.left) { POMO.left = left; updatePomo(); }
  if (left > 0) return;
  pomoStop(); chime();
  if (POMO.mode === "focus") {
    const c = pomoCount() + 1; ls.set(LS_POMO, {date:todayISO(), count:c});
    logFocus(Math.round(POMO.dur.focus / 60));
    const next = c % 4 === 0 ? "long" : "short";
    toast(c % 4 === 0 ? "Vier Fokusrunden geschafft. Jetzt 15 Minuten Pause." : "Fokusrunde geschafft und als Lernzeit gespeichert. Fünf Minuten Pause.");
    POMO.mode = next; POMO.left = POMO.dur[next];
    if (ui.tab === "uebersicht") renderView();
  } else { toast("Pause vorbei. Bereit für die nächste Runde?"); POMO.mode = "focus"; POMO.left = POMO.dur.focus; updatePomo(); }
}

/* Countdowns */
function cardProgress(){
  const s = S(), t = todayISO(), rows = [];
  const add = (label, d, sub) => { if (!validISO(d)) return; const n = dayDiff(t, d); if (n < 0) return; rows.push({label, n, sub: sub || fmt(d, "dmy")}); };
  if (validISO(s.breakStart) && t < s.breakStart) add(parseISO(s.breakStart).getMonth() === 11 ? "Weihnachtspause" : "Vorlesungsfreie Tage", s.breakStart);
  if (t < s.examStart) add("Vorlesungsende", s.lecEnd);
  add("1. Prüfungszeitraum", s.examStart, `${fmt(s.examStart, "dm")} bis ${fmt(s.examEnd, "dmy")}`);
  const nd = upcomingDeadlines().find(x => validISO(x.date) && x.date >= t); if (nd) add(nd.title, nd.date);
  const ne = state.exams.filter(e => validISO(e.date) && e.date >= t).sort((a, b) => a.date.localeCompare(b.date))[0];
  if (ne) add(`Prüfung ${shortName(courseMap()[ne.courseId])}`, ne.date);
  rows.sort((a, b) => a.n - b.n);
  const lw = lectureWeek(new Date());
  return `<div class="card-h"><h2 id="h-time">Countdown</h2>${typeof lw.cur === "number" ? `<span class="muted small">Woche ${lw.cur} von ${lw.total}</span>` : ""}</div>
    ${typeof lw.cur === "number" ? `<div class="bar" style="margin:-4px 0 14px"><span style="width:${Math.round(lw.cur / lw.total * 100)}%"></span></div>` : ""}
    ${rows.length ? `<div class="cd-list">${rows.slice(0, 5).map(r => `<div class="cd-row"><div class="cd-n">${r.n}<small>${r.n === 1 ? "Tag" : "Tage"}</small></div><div style="min-width:0"><b>${esc(r.label)}</b><span class="s">${esc(r.sub)}</span></div></div>`).join("")}</div>` : `<p class="muted" style="margin:0">Keine Termine in Sicht.</p>`}`;
}

/* Kurse */
function courseCard(c){
  const p = courseProgress(c), ns = nextSession(c), ad = admissionOf(c);
  const meta = [c.lp ? fmtNum(num(c.lp)) + " LP" : "", c.assessment === "SL" ? "Studienleistung" : "", c.lecturer || ""].filter(Boolean).join(" · ");
  const nextTxt = ns ? `${ns.when} ${ns.start}${ns.room ? " · " + ns.room : ""}` : (isRunning(c) && !(c.slots || []).length ? "Zeiten fehlen noch" : "");
  const gradeHtml = typeof c.grade === "number" ? `<span class="grade" title="Note">${fmtGrade(c.grade)}</span>` : (c.targetGrade ? `<span class="grade target" title="Ziel-Note">Ziel ${fmtGrade(c.targetGrade)}</span>` : "");
  const foot = ad ? `<span class="adm ${ad.reached ? "ok" : ""}">${ad.need === null ? "Zulassung: Punkte fehlen" : ad.reached ? "Zulassung erreicht" : `Zulassung: noch ${fmtNum(ad.missing)} P.`}</span>`
    : `${p.total ? squares(p.done, p.total) : ""}<span class="count">${p.total ? `${p.done} von ${p.total} Abgaben` : (c.status && c.status !== "läuft" ? esc(c.status) : "Noch keine Abgaben")}</span>`;
  return `<button class="ccard ${SUBJ_CLASS[c.subject] || "s-other"}" data-course="${esc(c.id)}">
    <span class="ccover">${courseArt(c)}</span>
    <span class="cbody">
      <span class="row"><span class="chip">${esc(c.subject || "Kurs")}</span><span class="code">${esc(c.code || "")}</span></span>
      <span class="name">${esc(c.name)}</span>
      ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}
      ${nextTxt ? `<span class="next">${ns ? ICON.cal : ""}${esc(nextTxt)}</span>` : ""}
      <span class="foot"><span class="prog-dots">${foot}</span>${gradeHtml}</span>
    </span>
  </button>`;
}
const missingTemplates = () => TEMPLATE_COURSES.filter(t => !state.courses.some(c => c.id === t.id));
function coursesEmpty(){
  return emptyBox("Noch keine Kurse. Leg deinen ersten Kurs an oder übernimm die Module aus dem 1. Fachsemester (Anglistik + Informatik) als Startpunkt.",
    `<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-template>Module übernehmen</button>${addBtn("courses", "Eigener Kurs")}</span>`);
}
function sortedCourses(){
  const order = {"läuft":0,"geplant":1,"bestanden":2,"nicht bestanden":3};
  return [...state.courses].sort((a, b) => termKey(termOf(b)) - termKey(termOf(a)) || (order[a.status] ?? 0) - (order[b.status] ?? 0) || SUBJECTS.indexOf(a.subject) - SUBJECTS.indexOf(b.subject) || (a.createdAt || 0) - (b.createdAt || 0) || String(a.name || "").localeCompare(String(b.name || "")));
}
function cardCourses(compact){
  let list = sortedCourses().filter(c => termOf(c) === curTerm());
  if (compact) list = list.filter(isRunning);
  const head = `<div class="card-h"><h2 id="h-courses">Kurse dieses Semester<span class="sub">${list.length ? list.length + " laufend · " + fmtNum(list.reduce((s, c) => s + (num(c.lp) || 0), 0)) + " LP" : ""}</span></h2>
    <div class="actions"><button class="btn ghost" data-tab="kurse">Alle Kurse</button></div></div>`;
  if (!isReady()) return head + loadingCard();
  if (!state.courses.length) return head + coursesEmpty();
  if (!list.length) return head + `<p class="muted">Kein Kurs läuft gerade in ${esc(curTerm())}.</p>`;
  return head + `<div class="courses">${list.map(courseCard).join("")}</div>`;
}
function viewCourses(){
  const terms = [...new Set(state.courses.map(termOf))].sort((a, b) => termKey(b) - termKey(a));
  if (!["aktuell","alle", ...terms].includes(ui.termFilter)) ui.termFilter = "aktuell";
  const byTerm = c => ui.termFilter === "alle" || (ui.termFilter === "aktuell" ? termOf(c) === curTerm() : termOf(c) === ui.termFilter);
  const pool = sortedCourses().filter(byTerm);
  const filters = ["Alle", ...SUBJECTS.filter(s => pool.some(c => c.subject === s))];
  if (!filters.includes(ui.courseFilter)) ui.courseFilter = "Alle";
  const list = pool.filter(c => ui.courseFilter === "Alle" || c.subject === ui.courseFilter);
  const miss = missingTemplates();
  const stale = state.courses.filter(c => termOf(c) !== curTerm() && (!c.status || c.status === "läuft"));
  let body;
  if (!isReady()) body = loadingCard();
  else if (!state.courses.length) body = coursesEmpty();
  else if (!list.length) body = `<p class="muted">Keine Kurse in dieser Auswahl.</p>`;
  else body = `<div class="courses">${list.map(courseCard).join("")}</div>`;
  const tBtn = (v, l) => `<button data-filter="termFilter:${esc(v)}" aria-pressed="${ui.termFilter === v}">${esc(l)}</button>`;
  return `<div class="card">
    <div class="card-h"><h2>Kurse<span class="sub">${pool.length} in dieser Auswahl</span></h2>
      <div class="actions">${state.courses.length && miss.length ? `<button class="btn" data-template>Fehlende Module übernehmen (${miss.length})</button>` : ""}<button class="btn primary" data-new="courses">${ICON.plus}Kurs</button></div></div>
    ${stale.length ? `<div class="warn" style="margin:0 0 14px"><div class="warn-h">${ICON.alarm}Semester abschließen</div><p class="small" style="margin:0">${stale.length} ${stale.length === 1 ? "Kurs" : "Kurse"} aus früheren Semestern ${stale.length === 1 ? "läuft" : "laufen"} noch. Trag Status und Note ein, damit deine Leistungspunkte stimmen.</p></div>` : ""}
    <div class="filters" style="margin-bottom:12px;justify-content:space-between">
      <div class="seg" role="group" aria-label="Semester">${tBtn("aktuell", curTerm())}${terms.filter(t => t !== curTerm()).map(t => tBtn(t, t)).join("")}${terms.length > 1 ? tBtn("alle", "Alle Semester") : ""}</div>
      ${pool.length ? `<div class="filters" role="group" aria-label="Nach Fach filtern">${filters.map(f => `<button class="pill ${ui.courseFilter === f ? "st-done" : "st-offen"}" data-filter="courseFilter:${esc(f)}" aria-pressed="${ui.courseFilter === f}">${esc(f)}</button>`).join("")}</div>` : ""}
    </div>
    ${body}
  </div>`;
}

/* Aufgaben */
function taskRow(t, cm){
  const done = t.status === "erledigt", c = cm[t.courseId], subs = Array.isArray(t.subtasks) ? t.subtasks.filter(x => x.text) : [];
  const due = validISO(t.due) ? relDue(t.due) + (t.time ? " · " + t.time : "") : "";
  const meta = [
    t.priority === "hoch" && !done ? `<span class="pill prio">Wichtig</span>` : "",
    c ? subjChip(c) : "",
    t.status === "in Arbeit" ? `<span class="pill st-arbeit">in Arbeit</span>` : "",
    subs.length ? `<span class="tag">${subs.filter(x => x.done).length}/${subs.length} Schritte</span>` : "",
    t.repeat === "weekly" ? `<span class="tag">wöchentlich</span>` : "",
    t.plan ? `<span class="tag">Lernplan</span>` : "",
    due ? `<span class="due ${dueClass(t.due, done)}">${esc(due)}</span>` : ""
  ].filter(Boolean).join("");

/* Kalender */

  const cm = courseMap(), out = [];
  shiftsOn(d).forEach(sh => out.push({type:"sh", s:sh.s, time:shiftTime(sh), label:"Schicht" + (sh.label ? " · " + sh.label : ""), ref:"shifts:" + sh.id}));
  state.exams.forEach(e => { if (e.date === d) out.push({type:"ex", s:toMin(e.time) ?? 0, label:(cm[e.courseId] ? courseLabel(cm[e.courseId]) + " · " : "") + (e.kind || "Prüfung"), time:e.time, exam:e.id}); if (e.regDeadline === d && !e.registered) out.push({type:"fr", s:1439, label:"Anmeldeschluss: " + courseLabel(cm[e.courseId]), exam:e.id}); });

  state.assignments.forEach(a => { if (a.due === d) out.push({type:"dl", s:toMin(a.dueTime) ?? 1439, label:"Abgabe: " + a.title, time:a.dueTime, ref:"assignments:" + a.id, done:a.status === "abgegeben"}); });
  state.projects.forEach(p => { if (p.date === d) out.push({type:"pj", s:toMin(p.time) ?? 0, label:p.title, time:p.time, project:p.id}); (p.meetings || []).forEach(m => { if (m.date === d) out.push({type:"pj", s:toMin(m.time) ?? 0, label:"Treffen: " + p.title, time:m.time, project:p.id}); }); });
  state.tasks.forEach(t => { if (t.due === d) out.push({type:"tk", s:toMin(t.time) ?? 1440, label:t.title, time:t.time, ref:"tasks:" + t.id, done:t.status === "erledigt"}); });

}

function parseSpotify(raw){
  const s = String(raw || "").trim();
  const m = s.match(/^spotify:([a-z]+):([A-Za-z0-9]{10,40})$/);
  if (m && SPOTIFY_KINDS.includes(m[1])) return {kind:m[1], uri:s, url:`https://open.spotify.com/${m[1]}/${m[2]}`};
  let u; try { u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s); } catch(e){ return null; }
  if (u.hostname === "open.spotify.com") {
    const parts = u.pathname.split("/").filter(p => p && !/^intl-/i.test(p));
    if (parts.length >= 2 && SPOTIFY_KINDS.includes(parts[0]) && /^[A-Za-z0-9]{10,40}$/.test(parts[1])) return {kind:parts[0], uri:`spotify:${parts[0]}:${parts[1]}`, url:`https://open.spotify.com/${parts[0]}/${parts[1]}`};
  }
  if (u.hostname === "spotify.link" && /^\/[A-Za-z0-9]{4,40}$/.test(u.pathname)) return {kind:"link", uri:"", url:`https://spotify.link${u.pathname}`};
  return null;
}

function clockSVG(){
  let ticks = "";
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6, major = i % 3 === 0, r1 = major ? 35 : 39, r2 = 43;
    ticks += `<line class="tick${major ? " major" : ""}" x1="${(50 + r1 * Math.sin(a)).toFixed(2)}" y1="${(50 - r1 * Math.cos(a)).toFixed(2)}" x2="${(50 + r2 * Math.sin(a)).toFixed(2)}" y2="${(50 - r2 * Math.cos(a)).toFixed(2)}"/>`;
  }
  return `<svg class="aclock" viewBox="0 0 100 100" aria-hidden="true"><circle class="face" cx="50" cy="50" r="47"/>${ticks}<line id="handH" class="hh" x1="50" y1="53" x2="50" y2="29"/><line id="handM" class="hm" x1="50" y1="54" x2="50" y2="15"/><line id="handS" class="hs" x1="50" y1="59" x2="50" y2="11"/><circle class="hub" cx="50" cy="50" r="2.6"/></svg>`;
}
function tickClock(){
  const d = new Date(), sec = d.getSeconds(), min = d.getMinutes() + sec / 60, hr = (d.getHours() % 12) + min / 60;
  const rot = (id, deg) => { const el = document.getElementById(id); if (el) el.setAttribute("transform", `rotate(${deg.toFixed(2)} 50 50)`); };
  rot("handH", hr * 30); rot("handM", min * 6); rot("handS", sec * 6);
  const dt = document.getElementById("todayClock"); if (dt) dt.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function chime(){
  try { if (!audioCtx) return; const t0 = audioCtx.currentTime;
    [0, .22, .44].forEach((dt, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = "sine"; o.frequency.value = [660, 880, 990][i];
      g.gain.setValueAtTime(0.0001, t0+dt); g.gain.exponentialRampToValueAtTime(0.2, t0+dt+.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+dt+.35);
      o.connect(g).connect(audioCtx.destination); o.start(t0+dt); o.stop(t0+dt+.4); });
  } catch(e){}
}

/* Karteikarten abfragen */
const REVIEW = {queue:[], idx:0, shown:false, right:0, wrong:0, label:""};
function startReview(key){
  const t = todayISO(), cm = courseMap();
  const list = state.cards.filter(k => (!validISO(k.due) || k.due <= t) && (key === "all" || (key === "none" ? !k.courseId : k.courseId === key)));
  if (!list.length) { toast("Gerade ist keine Karte fällig."); return; }
  list.sort((a, b) => (Number(a.box) || 1) - (Number(b.box) || 1) || Math.random() - 0.5);
  Object.assign(REVIEW, {queue:list.map(k => k.id), idx:0, shown:false, right:0, wrong:0, label:key === "all" ? "Alle fälligen Karten" : key === "none" ? "Ohne Kurs" : shortName(cm[key])});
  openSheet({kind:"review"});
}
function reviewView(){
  const head = `<div class="panel-h"><div style="min-width:0"><div class="eyebrow"><span class="tag">Karteikarten</span></div><h2 id="panelTitle">${esc(REVIEW.label)}</h2></div>${closeBtn}</div>`;
  const id = REVIEW.queue[REVIEW.idx], k = state.cards.find(x => x.id === id);
  if (!k) return head + `<div class="flash"><div class="face">Geschafft! ${REVIEW.right} gewusst, ${REVIEW.wrong} kommen morgen wieder.</div><div class="btns"><button class="btn primary" data-close>Fertig</button></div></div>`;
  const c = courseMap()[k.courseId];
  return head + `<div class="flash"><div class="meta"><span>Karte ${REVIEW.idx + 1} von ${REVIEW.queue.length}</span><span>${c ? esc(shortName(c)) + " · " : ""}Fach ${Number(k.box) || 1}</span></div>
    <div class="face">${esc(k.front)}</div>
    ${REVIEW.shown ? `<div class="face back">${esc(k.back || "–")}</div><div class="btns"><button class="btn" data-answer="0">${ICON.reset}Nicht gewusst</button><button class="btn primary" data-answer="1">${ICON.check}Gewusst</button></div>`
      : `<div class="btns"><button class="btn primary" data-reveal>Antwort zeigen</button></div>`}</div>`;
}
async function answerCard(ok){
  const id = REVIEW.queue[REVIEW.idx], k = state.cards.find(x => x.id === id); if (!k) return;
  const box = ok ? Math.min(5, (Number(k.box) || 1) + 1) : 1;
  const due = iso(addDays(new Date(), ok ? CARD_STEPS[box - 1] : 1));
  if (ok) REVIEW.right++; else REVIEW.wrong++;
  REVIEW.idx++; REVIEW.shown = false; showSheet(true);
  put("cards", {...k, box, due, lastReview:todayISO(), updatedAt:Date.now()});
}

  if (c.type === "select") return `<label class="c ${c.wide ? "wide" : ""}"><span>${c.label}</span><select id="${id}" data-k="${c.k}">${opt(c.opts, v === undefined ? "" : String(v))}</select></label>`;

/* ---------- Förde als Linienzeichnung ---------- */
/* Sonnenauf- und -untergang in Kiel, Monatsmitte, Ortszeit in Stunden */
const KIEL_SUN = [[8.50,16.35],[7.75,17.25],[6.75,18.15],[6.55,20.05],[5.40,20.90],[4.75,21.75],[5.10,21.65],[5.90,20.75],[6.90,19.50],[7.85,18.40],[7.85,16.50],[8.60,16.00]];
function sunTimes(d){
  const m = d.getMonth(), f = (d.getDate() - 15) / 30, o = f >= 0 ? (m + 1) % 12 : (m + 11) % 12, w = Math.min(1, Math.abs(f));
  return [KIEL_SUN[m][0] * (1 - w) + KIEL_SUN[o][0] * w, KIEL_SUN[m][1] * (1 - w) + KIEL_SUN[o][1] * w];
}
const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixA = (A, B, t) => A.map((v, i) => v + (B[i] - v) * t);
const css = A => `rgb(${A.map(v => Math.round(v)).join(",")})`;
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function drawSky(){
  const cv = document.getElementById("sky"); if (!cv) return;
  const hero = cv.parentElement, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(1, Math.round(hero.clientWidth * dpr)), H = Math.max(1, Math.round(hero.clientHeight * dpr));
  if (cv.width !== W) cv.width = W;
  if (cv.height !== H) cv.height = H;
  let g; try { g = cv.getContext("2d"); } catch(e){ g = null; } if (!g) return;
  const u = dpr, now = new Date(), hr = now.getHours() + now.getMinutes() / 60, [rise, set] = sunTimes(now);
  const p = (hr - rise) / (set - rise);
  const e = p >= 0 && p <= 1 ? Math.sin(Math.PI * p) : -Math.min((p < 0 ? rise - hr : hr - set) / 1.6, 1);
  const day = Math.max(0, Math.min(1, (e + 0.2) / 0.6));
  const hy = Math.round(H * 0.6);
  // Grund: tiefe Nacht, am Tag ein Hauch Blau
  let gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, css(mixA(hx("#0a0e1c"), hx("#10203d"), day))); gr.addColorStop(0.62, css(mixA(hx("#080a12"), hx("#0b1324"), day))); gr.addColorStop(1, "#07080b");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const blob = (x, y, r, rgb, a) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, `rgba(${rgb},${a})`); rg.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2); };
  blob(W * 0.16, H * 0.05, W * 0.32, "80,170,255", 0.20);
  blob(W * 0.8, -H * 0.1, W * 0.3, "150,110,255", 0.17);
  // Sonne: Position über den Tag, warmes Glimmen nahe am Horizont
  const sx = W * (0.06 + 0.88 * Math.max(-0.03, Math.min(1.03, p)));
  const warm = Math.max(0, 1 - Math.abs(e + 0.02) / 0.32);
  if (warm > 0) blob(sx, hy, W * 0.36, "255,140,95", 0.30 * warm);
  // Punktraster
  g.fillStyle = "rgba(255,255,255,.05)";
  const step = 18 * u;
  for (let y = step / 2; y < hy; y += step) for (let x = step / 2; x < W; x += step) g.fillRect(x, y, u, u);
  // Sterne
  if (e < 0.05) {
    const R = rng(1242), a = Math.min(1, (0.05 - e) / 0.45);
    g.fillStyle = "#eaf3ff";
    for (let i = 0; i < 110; i++) { const x = R() * W, y = R() * hy * 0.9, r = (0.35 + R() * 0.8) * u; g.globalAlpha = a * (0.25 + R() * 0.75); g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }

    g.save(); g.beginPath(); g.arc(mx, my, mr, 0, 7); g.clip();
    g.fillStyle = "rgba(220,232,255,.85)"; g.beginPath(); g.arc(mx - mr * 0.55, my + mr * 0.15, mr, 0, 7); g.fill(); g.restore();

  g.lineWidth = 1 * u; g.strokeStyle = "rgba(150,195,255,.5)";
  [[0.165, 34], [0.21, 27]].forEach(([fx, ht]) => { const x = W * fx, b = hy - 9 * u, t = b - ht * u; g.beginPath(); g.moveTo(x, b); g.lineTo(x, t); g.moveTo(x - 7 * u, t + 3 * u); g.lineTo(x + 26 * u, t + 3 * u); g.moveTo(x, t - 4 * u); g.lineTo(x + 20 * u, t + 3 * u); g.moveTo(x + 22 * u, t + 3 * u); g.lineTo(x + 22 * u, t + 11 * u); g.stroke(); });
  g.shadowBlur = 0;
  // Wasser: gestrichelte Linien, unter Sonne oder Mond heller
  const R2 = rng(97);
  for (let y = hy + 5 * u, row = 0; y < H; y += 5 * u, row++) {
    const depth = (y - hy) / (H - hy), a = 0.16 * (1 - depth) + 0.03;
    let x = -R2() * 40 * u;

      if (R2() > 0.3) {

        g.fillRect(x, y, len, Math.max(1, u * 0.9));
      }
      x += len + gap;
    }
  }
  // Leuchtturm in der Förde
  const lx = W * 0.7, lb = hy + 8 * u, lh = 26 * u, dark = day < 0.6;
  g.strokeStyle = "rgba(200,225,255,.75)"; g.lineWidth = 1.1 * u; g.fillStyle = "#07080b";
  g.beginPath(); g.moveTo(lx - 4 * u, lb); g.lineTo(lx - 2.6 * u, lb - lh); g.lineTo(lx + 2.6 * u, lb - lh); g.lineTo(lx + 4 * u, lb); g.closePath(); g.fill(); g.stroke();

  g.strokeRect(lx - 3 * u, lb - lh - 5 * u, 6 * u, 5 * u);

  g.beginPath(); g.moveTo(bx - 16 * u, by); g.lineTo(bx + 16 * u, by); g.lineTo(bx + 11 * u, by + 5 * u); g.lineTo(bx - 12 * u, by + 5 * u); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(bx - 1 * u, by - 2 * u); g.lineTo(bx - 1 * u, by - 30 * u); g.lineTo(bx - 14 * u, by - 2 * u); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(bx + 1.5 * u, by - 2 * u); g.lineTo(bx + 1.5 * u, by - 24 * u); g.lineTo(bx + 12 * u, by - 2 * u); g.closePath(); g.fill(); g.stroke();
